<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0647a8"><meta name="description" content="Yubaraj Finance & Stock - offline finance, member and stock management">
<link rel="manifest" href="manifest.json"><title>Yubaraj Finance & Stock</title>
<style>
:root{--blue:#0647a8;--cyan:#05b9e9;--bg:#f3f7fc;--ink:#172033;--green:#118a50;--red:#c62828}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:var(--bg);color:var(--ink)}header{background:linear-gradient(120deg,#063a91,#087de0);color:white;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:4;box-shadow:0 2px 8px #0002}header img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:white}header h1{font-size:18px;margin:0}header small{opacity:.85}.wrap{padding:12px;max-width:1100px;margin:auto}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 12px}.nav button{white-space:nowrap;border:0;border-radius:22px;padding:10px 14px;background:#dce9fb;color:#123b75;font-weight:700}.nav button.active{background:var(--blue);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 10px #102e5510;margin-bottom:12px}.stat{font-size:22px;font-weight:800;margin-top:7px;color:var(--blue)}h2{font-size:18px;margin:4px 0 14px}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit}textarea{min-height:70px}button{cursor:pointer}.btn{border:0;background:var(--blue);color:white;padding:11px 14px;border-radius:9px;font-weight:700;margin:8px 5px 0 0}.btn.secondary{background:#e4edf9;color:#153f7b}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.hidden{display:none!important}.hint{font-size:12px;color:#64748b}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px;background:white}th,td{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:13px}th{background:#edf4ff}.pill{display:inline-block;background:#e4f6ed;color:#11663c;padding:4px 8px;border-radius:20px;font-size:12px}.status{padding:9px;border-radius:8px;background:#eaf2ff;margin:8px 0;overflow-wrap:anywhere}.danger{color:var(--red)}.photo{width:70px;height:70px;object-fit:cover;border-radius:50%;border:2px solid #dbeafe}
</style></head><body>
<header><img id="appIcon" src="icon.png" alt="icon"><div><h1>Yubaraj Finance &amp; Stock</h1><small>Offline Finance • Members • Stock • Loans</small></div></header>
<div class="wrap"><div id="status" class="status">Offline-ready. Your entries are saved on this device.</div>
<div class="nav" id="nav"></div><main id="main"></main>
<footer class="hint">Keep regular backups. Google Sheets sync requires a configured Apps Script Web App URL.</footer></div>
<script>
const DBKEY='yfs_db_v1';
const emptyDB=()=>({members:[],products:[],tx:[],savings:[],loans:[],payments:[],transfers:[],receipts:[],settings:{scriptUrl:''},syncQueue:[]});
let db;try{db=Object.assign(emptyDB(),JSON.parse(localStorage.getItem(DBKEY)||'{}'))}catch(e){db=emptyDB()}
function persist(){localStorage.setItem(DBKEY,JSON.stringify(db));}
function uid(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toFixed(2)}
function today(){return new Date().toISOString().slice(0,10)}
function setStatus(s){document.getElementById('status').textContent=s}
const pages=[['dashboard','Dashboard'],['members','Members'],['products','Product / Stock'],['buy','Buy'],['sell','Sell'],['savings','Savings'],['loans','Loans'],['payments','Loan Payments'],['transfers','Transfers'],['reports','Reports'],['sync','Online Sync / Backup']];
let page='dashboard';
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${page===p[0]?'active':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('')}
function go(p){page=p;nav();render()}
function memberOptions(){return '<option value="">Select member (optional)</option>'+db.members.map(m=>`<option value="${esc(m.id)}">${esc(m.id)} — ${esc(m.name)}</option>`).join('')}
function productOptions(){return '<option value="">Select product</option>'+db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (stock ${p.qty})</option>`).join('')}
function memberBalance(id){let dep=db.savings.filter(x=>x.memberId===id&&x.kind==='Deposit').reduce((a,x)=>a+x.amount,0),wd=db.savings.filter(x=>x.memberId===id&&x.kind==='Withdraw').reduce((a,x)=>a+x.amount,0);return dep-wd}
function outstandingLoan(l){return Math.max(0,(l.principal||0)-(db.payments.filter(p=>p.loanId===l.id).reduce((a,p)=>a+p.principal,0)))}
function render(){let m=document.getElementById('main');if(page==='dashboard'){m.innerHTML=`<div class="grid">${[['Members',db.members.length],['Products',db.products.length],['Buy total',money(db.tx.filter(x=>x.kind==='Buy').reduce((a,x)=>a+x.total,0))],['Sales total',money(db.tx.filter(x=>x.kind==='Sell').reduce((a,x)=>a+x.total,0))],['Savings balance',money(db.savings.reduce((a,x)=>a+(x.kind==='Deposit'?x.amount:-x.amount),0))],['Loan outstanding',money(db.loans.reduce((a,l)=>a+outstandingLoan(l),0))],['Loan payments',money(db.payments.reduce((a,p)=>a+p.total,0))],['Stock items',db.products.reduce((a,p)=>a+Number(p.qty),0)]] .map(x=>`<div class="card"><div>${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="card"><h2>Quick notes</h2><p class="hint">Data is saved locally on this device. Export a backup before clearing browser data or reinstalling the app.</p></div>`}
else if(page==='members'){m.innerHTML=`<div class="card"><h2>Member Entry</h2><form id="memberForm"><div class="row"><div><label>Name *</label><input name="name" required></div><div><label>Company</label><input name="company"></div><div><label>Trade</label><input name="trade"></div><div><label>Photo</label><input name="photo" type="file" accept="image/*"></div><div><label>Gmail</label><input name="gmail" type="email"></div><div><label>WhatsApp</label><input name="whatsapp"></div><div><label>Staff Name</label><input name="staff"></div><div><label>Opening Balance</label><input name="opening" type="number" step=".01" value="0"></div></div><button class="btn">Save Member</button></form></div><div class="card"><h2>Members (${db.members.length})</h2>${table(['ID','Name','Company','Trade','WhatsApp','Staff','Opening','Actions'],db.members.map(x=>[x.id,x.name,x.company,x.trade,x.whatsapp,x.staff,money(x.opening),`<button class="btn red" onclick="del('members','${x.id}')">Delete</button>`]))}</div>`;
document.getElementById('memberForm').onsubmit=async e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(db.members.some(x=>(d.whatsapp&&x.whatsapp===d.whatsapp)||(d.gmail&&x.gmail.toLowerCase()===d.gmail.toLowerCase()))){alert('Duplicate Gmail or WhatsApp found.');return}let photo=f.photo.files[0]?await fileData(f.photo.files[0]):'';db.members.push({id:uid('MEM'),name:d.name.trim(),company:d.company,trade:d.trade,gmail:d.gmail,whatsapp:d.whatsapp,staff:d.staff,opening:+d.opening||0,photo,date:today()});persist();render();setStatus('Member saved offline.')}}
else if(page==='products'){m.innerHTML=`<div class="card"><h2>Product / Stock Entry</h2><form id="prodForm"><div class="row"><div><label>Product Name *</label><input name="name" required></div><div><label>Description</label><input name="desc"></div><div><label>Stock Quantity *</label><input name="qty" type="number" min="0" step=".001" required></div><div><label>Buy Rate *</label><input name="buyRate" type="number" min="0" step=".01" required></div><div><label>Sale Rate *</label><input name="saleRate" type="number" min="0" step=".01" required></div></div><button class="btn">Save Product</button></form></div><div class="card"><h2>Product List</h2>${table(['ID','Product','Description','Stock','Buy Rate','Sale Rate','Actions'],db.products.map(x=>[x.id,x.name,x.desc,x.qty,money(x.buyRate),money(x.saleRate),`<button class="btn red" onclick="del('products','${x.id}')">Delete</button>`]))}</div>`;
document.getElementById('prodForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(db.products.some(x=>x.name.toLowerCase()===d.name.trim().toLowerCase())){alert('This product name already exists.');return}db.products.push({id:uid('PRD'),name:d.name.trim(),desc:d.desc,qty:+d.qty,buyRate:+d.buyRate,saleRate:+d.saleRate});persist();render();setStatus('Product saved offline.')}}
else if(page==='buy'||page==='sell'){let kind=page==='buy'?'Buy':'Sell';m.innerHTML=`<div class="card"><h2>${kind} Transaction</h2><form id="txForm"><div class="row"><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div><label>Customer Type</label><select name="ctype"><option>Member</option><option>Non-Member</option></select></div><div id="memberField"><label>Member</label><select name="memberId">${memberOptions()}</select></div><div><label>Non-member/customer name</label><input name="customer"></div><div><label>Product *</label><select name="productId" required>${productOptions()}</select></div><div><label>Quantity *</label><input name="qty" type="number" min=".001" step=".001" required></div><div><label>Rate (locked from product)</label><input name="rate" readonly required></div><div><label>Total</label><input name="total" readonly></div><div><label>Payment Type</label><select name="payment"><option>Cash</option><option>Credit</option><option>Partial</option></select></div><div><label>Amount Received</label><input name="received" type="number" min="0" step=".01" value="0"></div><div><label>Staff Name</label><input name="staff"></div></div><button class="btn">Save ${kind}</button></form><p class="hint">Sale rate is read-only and loaded from Product/Stock Entry.</p></div><div class="card"><h2>${kind} History</h2>${table(['ID','Date','Type','Customer','Product','Qty','Rate','Total','Received','Due'],db.tx.filter(x=>x.kind===kind).map(x=>[x.id,x.date,x.ctype,x.customerName,x.productName,x.qty,money(x.rate),money(x.total),money(x.received),money(x.total-x.received)]))}</div>`;
let f=document.getElementById('txForm'),p=f.productId,r=f.rate,q=f.qty,t=f.total;
function calc(){let pr=db.products.find(x=>x.id===p.value);r.value=pr?(kind==='Sell'?pr.saleRate:pr.buyRate):'';t.value=money((+q.value||0)*(+r.value||0))}
p.onchange=calc;q.oninput=calc;f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),pr=db.products.find(x=>x.id===d.productId);if(!pr)return;let qty=+d.qty,rate=kind==='Sell'?pr.saleRate:pr.buyRate,total=qty*rate,received=+d.received||0;if(kind==='Sell'&&qty>pr.qty){alert('Not enough stock. Available: '+pr.qty);return}if(received>total){alert('Received amount cannot exceed total.');return}if(d.ctype==='Member'&&!d.memberId){alert('Select a member or choose Non-Member.');return}if(kind==='Sell')pr.qty-=qty;else pr.qty+=qty;db.tx.push({id:uid('TRX'),kind,date:d.date,ctype:d.ctype,memberId:d.ctype==='Member'?d.memberId:'',customerName:d.ctype==='Member'?(db.members.find(x=>x.id===d.memberId)?.name||''):d.customer,productId:pr.id,productName:pr.name,qty,rate,total,received,staff:d.staff,payment:d.payment});persist();render();setStatus(kind+' transaction saved offline.')}}
else if(page==='savings'){m.innerHTML=`<div class="card"><h2>Member Deposit / Withdraw</h2><form id="savForm"><div class="row"><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div><label>Member *</label><select name="memberId" required>${memberOptions()}</select></div><div><label>Type</label><select name="kind"><option>Deposit</option><option>Withdraw</option></select></div><div><label>Amount *</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Staff</label><input name="staff"></div><div><label>Remarks</label><input name="remarks"></div></div><button class="btn">Save</button></form></div><div class="card"><h2>Saving History</h2>${table(['ID','Date','Member','Type','Amount','Staff'],db.savings.map(x=>[x.id,x.date,db.members.find(m=>m.id===x.memberId)?.name||x.memberId,x.kind,money(x.amount),x.staff]))}</div>`;document.getElementById('savForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let amount=+d.amount;if(d.kind==='Withdraw'&&amount>memberBalance(d.memberId)){alert('Withdrawal exceeds recorded savings balance.');return}db.savings.push({id:uid('SAV'),...d,amount});persist();render();setStatus('Saving transaction saved offline.')}}
else if(page==='loans'){m.innerHTML=`<div class="card"><h2>Issue Loan</h2><form id="loanForm"><div class="row"><div><label>Member *</label><select name="memberId" required>${memberOptions()}</select></div><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div><label>Principal *</label><input name="principal" type="number" min=".01" step=".01" required></div><div><label>Interest Rate % (per year)</label><input name="rate" type="number" min="0" step=".01" value="12" required></div><div><label>Interest Method</label><select name="method"><option value="flat">Flat Rate</option><option value="reducing">Reducing Balance</option></select></div><div><label>Installment frequency</label><select name="freq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="daily">Daily</option></select></div><div><label>Term (number of periods)</label><input name="periods" type="number" min="1" value="12" required></div><div><label>Staff</label><input name="staff"></div></div><button class="btn">Create Loan</button></form><p class="hint">This starter calculates a schedule estimate. Confirm local lending rules and your agreed rate before using it for real accounting.</p></div><div class="card"><h2>Loan Register</h2>${table(['Loan ID','Member','Date','Principal','Rate %','Method','Frequency','Periods','Outstanding Principal','Status'],db.loans.map(l=>[l.id,db.members.find(x=>x.id===l.memberId)?.name||l.memberId,l.date,money(l.principal),l.rate,l.method,l.freq,l.periods,money(outstandingLoan(l)),outstandingLoan(l)<=0?'Paid':'Active']))}</div>`;document.getElementById('loanForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let principal=+d.principal,rate=+d.rate,periods=+d.periods,perRate=rate/100*(d.freq==='monthly'?1/12:d.freq==='weekly'?1/52:1/365),interest=d.method==='flat'?principal*perRate*periods:0;let payment=d.method==='flat'?(principal+interest)/periods:(perRate===0?principal/periods:principal*perRate/(1-Math.pow(1+perRate,-periods)));db.loans.push({id:uid('LOAN'),...d,principal,rate,periods,estimatedInterest:interest,estimatedInstallment:payment});persist();render();setStatus('Loan created offline. Estimated installment: '+money(payment))}}
else if(page==='payments'){m.innerHTML=`<div class="card"><h2>Loan Installment Payment</h2><form id="payForm"><div class="row"><div><label>Loan *</label><select name="loanId" required>${db.loans.filter(l=>outstandingLoan(l)>0).map(l=>`<option value="${l.id}">${l.id} — ${db.members.find(m=>m.id===l.memberId)?.name||l.memberId} — outstanding ${money(outstandingLoan(l))}</option>`).join('')}</select></div><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div><label>Principal Paid *</label><input name="principal" type="number" min="0" step=".01" value="0" required></div><div><label>Interest Paid *</label><input name="interest" type="number" min="0" step=".01" value="0" required></div><div><label>Late Fee</label><input name="fee" type="number" min="0" step=".01" value="0"></div><div><label>Staff</label><input name="staff"></div></div><button class="btn">Record Payment</button></form></div><div class="card"><h2>Payments History</h2>${table(['Payment ID','Date','Loan','Principal','Interest','Fee','Total'],db.payments.map(p=>[p.id,p.date,p.loanId,money(p.principal),money(p.interest),money(p.fee),money(p.total)]))}</div>`;document.getElementById('payForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),l=db.loans.find(x=>x.id===d.loanId),principal=+d.principal,interest=+d.interest,fee=+d.fee||0;if(!l)return;if(principal>outstandingLoan(l)){alert('Principal payment exceeds outstanding principal.');return}let total=principal+interest+fee;if(db.payments.some(p=>p.loanId===l.id&&p.date===d.date&&p.total===total)){alert('Possible duplicate payment detected.');return}db.payments.push({id:uid('PAY'),...d,principal,interest,fee,total});persist();render();setStatus('Loan payment saved offline.')}}
else if(page==='transfers'){m.innerHTML=`<div class="card"><h2>Member Balance Transfer</h2><form id="trForm"><div class="row"><div><label>From Member *</label><select name="from" required>${memberOptions()}</select></div><div><label>To Member *</label><select name="to" required>${memberOptions()}</select></div><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div><label>Amount *</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Staff</label><input name="staff"></div><div><label>Remarks</label><input name="remarks"></div></div><button class="btn">Transfer</button></form></div><div class="card"><h2>Transfer History</h2>${table(['ID','Date','From','To','Amount','Staff'],db.transfers.map(x=>[x.id,x.date,x.from,x.to,money(x.amount),x.staff]))}</div>`;document.getElementById('trForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.from===d.to){alert('From and To members must be different.');return}db.transfers.push({id:uid('TRF'),...d,amount:+d.amount});persist();render();setStatus('Transfer recorded offline. Note: this is a transfer register; it does not change savings ledger automatically.')}}
else if(page==='reports'){m.innerHTML=`<div class="card"><h2>Reports & Data Export</h2><p>Download each data set as CSV, or export the full backup JSON.</p>${['members','products','tx','savings','loans','payments','transfers'].map(k=>`<button class="btn secondary" onclick="csv('${k}')">Export ${k}</button>`).join('')}<button class="btn green" onclick="backup()">Download Full Backup</button><label>Restore Backup JSON</label><input type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div>`}
else if(page==='sync'){m.innerHTML=`<div class="card"><h2>Google Sheets Online Sync</h2><p class="hint">Paste your deployed Apps Script Web App URL below. This app cannot create a Google Sheet in your account until you deploy and authorize the script once.</p><label>Apps Script Web App URL</label><input id="scriptUrl" value="${esc(db.settings.scriptUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn" onclick="saveUrl()">Save URL</button><button class="btn green" onclick="syncOnline()">Save Online / Sync Now</button><div id="syncResult" class="status">Last sync: not recorded</div><h2>Backup</h2><button class="btn secondary" onclick="backup()">Download Backup JSON</button><button class="btn secondary" onclick="csv('all')">Download All CSV (ZIP not supported; exports JSON instead)</button><label>Restore Backup JSON</label><input type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div>`}
}
function table(head,rows){if(!rows.length)return '<p class="hint">No records yet.</p>';return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c??''}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}
function del(key,id){if(!confirm('Delete this record? Related financial history may remain.'))return;db[key]=db[key].filter(x=>x.id!==id);persist();render()}
function fileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function download(name,content,type){let a=document.createElement('a'),blob=new Blob([content],{type});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){download('yubaraj-finance-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
async function restoreFile(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!data.members||!data.products)throw Error('Invalid backup');if(!confirm('Replace local app data with this backup?'))return;db=Object.assign(emptyDB(),data);persist();go('dashboard');setStatus('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}}
function csv(key){if(key==='all'){backup();return}let arr=db[key]||[];if(!arr.length){alert('No records to export');return}let cols=[...new Set(arr.flatMap(o=>Object.keys(o)))],cell=v=>'"'+String(typeof v==='object'?JSON.stringify(v):v??'').replace(/"/g,'""')+'"';let out=[cols.map(cell).join(','),...arr.map(o=>cols.map(c=>cell(o[c])).join(','))].join('\r\n');download(key+'-'+today()+'.csv','\ufeff'+out,'text/csv;charset=utf-8')}
function saveUrl(){db.settings.scriptUrl=document.getElementById('scriptUrl').value.trim();persist();setStatus('Google Apps Script URL saved locally.')}
async function syncOnline(){let url=db.settings.scriptUrl;if(!url){alert('First save the deployed Apps Script Web App URL.');return}setStatus('Syncing...');try{let payload={app:'Yubaraj Finance & Stock',version:1,data:db};let res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});let txt=await res.text();document.getElementById('syncResult').textContent='Server response: '+txt;setStatus('Sync request completed. Check the response and Google Sheet.')}catch(e){setStatus('Sync failed or offline. Your data remains saved on this device.');document.getElementById('syncResult').textContent='Sync failed: '+e.message}}
nav();render();
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
