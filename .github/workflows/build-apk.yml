name: Build Yubaraj Finance Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f resources/icon.png
          test -f www/index.html
          echo "Required files found."

      - name: Install Dependencies
        run: npm install

      - name: Validate App Icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("resources/icon.png")
          print("Icon size:", img.size)
          img.verify()
          print("Icon is valid.")
          PY

      - name: Add Android Platform If Missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons
        run: |
          npx capacitor-assets generate --android

      - name: Sync Android Project
        run: npx cap sync android

      - name: Verify Android Project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/Yubaraj-Finance-Stock.apk

      - name: Generate Release Tag
        id: release
        run: |
          echo "tag=finance-stock-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_OUTPUT"

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Yubaraj Finance & Stock Build ${{ github.run_number }}
          body: |
            Yubaraj Finance & Stock Android APK.
            App icon generated from resources/icon.png.
          files: release/Yubaraj-Finance-Stock.apk
          make_latest: true
