name: Build Yubaraj Finance & Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Files
        run: |
          if [ ! -d www ]; then
            mkdir -p www
            if [ -f index.html ]; then
              cp index.html www/index.html
            else
              echo "ERROR: index.html not found"
              exit 1
            fi
          fi
          test -f www/index.html

      - name: Setup Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" \
            -name apksigner | sort -V | tail -1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"

          mkdir -p release-files
          cp "$APK" release-files/Yubaraj-Finance-Stock.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yubaraj Finance & Stock v1.0.${{ github.run_number }}
          body: |
            Yubaraj Finance & Stock Android APK.

            Download Yubaraj-Finance-Stock.apk below.
          files: release-files/Yubaraj-Finance-Stock.apk
          fail_on_unmatched_files: true
          make_latest: true
