name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Yubaraj Finance Stock APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Yubaraj-Finance-Stock.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finance-stock-${{ github.run_number }}
          name: Yubaraj Finance Stock Build ${{ github.run_number }}
          body: Yubaraj Finance and Stock Android APK
          files: release/Yubaraj-Finance-Stock.apk
          make_latest: true
