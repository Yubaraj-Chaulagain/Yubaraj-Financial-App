name: Build Yubaraj Finance Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "android/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: npm install

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -d www
          test -f www/index.html
          npx cap --version

      - name: Create Android Project If Missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = p.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'

          if permission not in content:
              match = re.search(r'<manifest\b[^>]*>', content)
              if not match:
                  raise SystemExit("Manifest opening tag not found")

              content = (
                  content[:match.end()]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + content[match.end():]
              )
              p.write_text(content, encoding="utf-8")
          PY

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Generate Release Tag
        id: release_tag
        run: |
          echo "tag=apk-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Yubaraj Finance & Stock APK
          body: |
            Yubaraj Finance & Stock Android APK

            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
