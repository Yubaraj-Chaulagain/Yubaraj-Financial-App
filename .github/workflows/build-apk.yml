name: Build Yubaraj Financial App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Prepare App Icon
        run: |
          if [ -f resources/icon.png ]; then
            echo "App icon found: resources/icon.png"
          else
            echo "ERROR: resources/icon.png not found"
            exit 1
          fi

          if [ -f www/icon.png ]; then
            echo "Web icon found: www/icon.png"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync Android Project
        run: npx cap sync android

      - name: Generate Android Launcher Icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yubaraj-Financial-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
