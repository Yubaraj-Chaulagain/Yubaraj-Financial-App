name: Build and Publish Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Install Dependencies
        run: npm install

      - name: Setup Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          fi

          test -f "$APK"

          mkdir -p release-files
          cp "$APK" release-files/Yubaraj-Finance-Stock-Release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yubaraj Finance & Stock v1.0.${{ github.run_number }}
          body: |
            Yubaraj Finance & Stock Android APK

            Download the APK below and install it on your Android phone.
          draft: false
          prerelease: false
          files: release-files/Yubaraj-Finance-Stock-Release.apk
