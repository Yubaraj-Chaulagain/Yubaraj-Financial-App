name: Build Yubaraj Financial App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - - name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Project Files
        run: |
          test -f package.json || (echo "ERROR: package.json missing" && exit 1)
          test -f capacitor.config.json || (echo "ERROR: capacitor.config.json missing" && exit 1)
          test -f resources/icon.png || (echo "ERROR: resources/icon.png missing" && exit 1)
          test -f www/index.html || (echo "ERROR: www/index.html missing" && exit 1)

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Prepare Android Platform
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Launcher Icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check Launcher Icons
        run: |
          echo "Generated Android launcher icons:"
          find android/app/src/main/res -type f \
            \( -name 'ic_launcher.png' \
            -o -name 'ic_launcher_round.png' \
            -o -name 'ic_launcher_foreground.png' \) \
            -print

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yubaraj-Financial-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
