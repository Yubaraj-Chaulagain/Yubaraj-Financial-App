name: Build Yubaraj Financial App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Capacitor Configuration
        run: |
          test -f package.json || (echo "ERROR: package.json missing" && exit 1)
          test -f capacitor.config.json || (echo "ERROR: capacitor.config.json missing" && exit 1)

      - name: Add Android Platform
        run: |
          npm install @capacitor/android
          npx cap add android

      - name: Prepare App Icon
        run: |
          if [ -f resources/icon.png ]; then
            echo "Photo icon found."
          else
            echo "ERROR: resources/icon.png not found."
            exit 1
          fi

      - name: Generate Android Launcher Icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Android Project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yubaraj-Financial-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
