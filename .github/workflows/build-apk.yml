name: Build Yubaraj Finance Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Check project files
      - name: Check Project Files
        run: |
          echo "Checking project files..."
          ls -la
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Add Android platform if missing
      - name: Add Android Platform If Missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 6. Setup Java 21
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 7. Verify Java version
      - name: Verify Java
        run: java -version

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Grant Gradle permission
      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      # 10. Build Android APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/Yubaraj-Finance-Stock.apk

      # 12. Generate release tag
      - name: Generate Release Tag
        id: release
        run: |
          echo "tag=finance-stock-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 13. Publish APK to GitHub Releases
      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Yubaraj Finance & Stock Build ${{ github.run_number }}
          body: |
            Yubaraj Finance & Stock Android Application.

            Download the APK below and install it on your Android phone.
          files: release/Yubaraj-Finance-Stock.apk
          make_latest: true
